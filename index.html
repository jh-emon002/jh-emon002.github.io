<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A personal academic portfolio: research, publications, projects, and experience."><meta name="theme-color" content="#101010"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>Your Name | Academic Portfolio</title><link rel="stylesheet" href="style.css"></head><body>
<a class="skip" href="#main">Skip to content</a>
<header><a class="brand" href="#home">Your Name</a><button id="menu" aria-label="Open navigation" aria-expanded="false">☰</button><nav aria-label="Main navigation"></nav><button id="search" aria-label="Search portfolio"><svg width="21" height="21" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg></button></header>
<main id="main"></main><footer>Copyright © <span id="year"></span> <span class="owner">Your Name</span>. All rights reserved.</footer>
<button id="customize" class="customize">✎ Customize</button>
<dialog id="editor"><form id="editor-form"><div class="dialog-top"><div><small>MAKE IT YOURS</small><h2>Customize your portfolio</h2></div><button type="button" class="close" aria-label="Close customization">×</button></div><p class="hint">Save a private preview in this browser. To publish your changes for every visitor, download settings.js, upload it to your GitHub repository, and commit the replacement.</p><label>Your name<input name="name" required maxlength="80"></label><label>Profile photo<input name="photo" type="text" placeholder="assets/portrait.jpg or https://…"></label><label>Or upload a photo<input id="photo-file" type="file" accept="image/*"></label><label>About me<textarea name="bio" rows="6"></textarea></label><label>Academic CV link<input name="cv" type="text" placeholder="assets/cv.pdf or https://…"></label><label>Email address<input name="email" type="email" placeholder="you@university.edu"></label><div id="page-editors"></div><div class="actions"><button type="submit">Save preview</button><button type="button" id="publish-config">Download settings.js</button><button type="button" id="export">Download backup</button><label class="import">Import settings<input type="file" id="import" accept="application/json"></label></div><p id="status" role="status"></p></form></dialog>
<dialog id="search-dialog"><div class="dialog-top"><h2>Search portfolio</h2><button class="close" aria-label="Close search">×</button></div><input id="query" aria-label="Search query" placeholder="Search research, projects, experience…"><div id="results"></div></dialog>
<noscript><p style="padding:80px 24px">Please enable JavaScript to view this portfolio.</p></noscript><script src="settings.js"></script><script src="app.js"></script></body></html>
