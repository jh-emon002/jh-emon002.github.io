<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio of Md Jaied Hasan: electrical engineering, wireless communication research, publications and projects.">
  <meta name="theme-color" content="#101820">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
  <title>Md Jaied Hasan | Research & Engineering Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#home">Skip to content</a>
  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a class="brand" href="#home" aria-label="Md Jaied Hasan - Home">
        <span class="brand-mark" aria-hidden="true"><img src="favicon.svg" alt="" width="35" height="35"></span>
        <span class="brand-name">Md Jaied Hasan</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation"></nav>
      <button type="button" class="search-trigger" id="search" aria-label="Search sections and projects" title="Search portfolio">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.7" cy="10.7" r="6.6"/><path d="m16 16 5 5"/></svg>
      </button>
    </div>
  </header>
  <main id="main"></main>
  <footer class="footer"><div class="container footer-inner"><span>&copy; <span id="year"></span> <span class="owner">Md Jaied Hasan</span></span><span>Always learning. Always improving.</span><a href="#home">Back to top &uarr;</a></div></footer>

  <dialog id="search-dialog" aria-label="Search portfolio">
    <div class="dialog-top"><h2>Search portfolio</h2><button type="button" class="close" aria-label="Close search">&times;</button></div>
    <label class="sr-only" for="query">Search by topic, publication, or project</label>
    <input id="query" type="search" placeholder="Search projects, publications, skills..." autocomplete="off">
    <div id="results" aria-live="polite"></div>
  </dialog>
  <dialog id="lightbox" aria-label="Image gallery viewer">
    <div class="lightbox-top"><p id="lightbox-caption" aria-live="polite"></p><button type="button" id="lightbox-close" aria-label="Close image viewer">&times;</button></div>
    <div class="lightbox-stage"><button type="button" id="lightbox-prev" aria-label="Previous image">&#8249;</button><img id="lightbox-img" alt=""><button type="button" id="lightbox-next" aria-label="Next image">&#8250;</button></div>
  </dialog>
  <noscript><p class="noscript">Enable JavaScript to view the portfolio.</p></noscript>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
